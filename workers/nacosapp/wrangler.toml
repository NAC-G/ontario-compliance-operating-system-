# ═════════════════════════════════════════════════════════════════════════════
# nacosapp — production Worker for naturalalternatives.ca
#
# This is the CANONICAL deploy config for the `nacosapp` Worker.
# Deploy from this directory with:  ./deploy.sh   (stages static assets first)
#
# ⚠ Do NOT deploy the old nac-os-app.naturalalternatives.ca repo as `nacosapp` —
#   its worker source is v3.0.0 (no Command Centre routes, no CMD_DB binding)
#   and deploying it overwrites this Worker and takes the site down.
# ═════════════════════════════════════════════════════════════════════════════

name = "nacosapp"
main = "index.js"
account_id = "3eff3eb9a85fbc5b027e51589d5ae634"
compatibility_date = "2024-11-01"
workers_dev = false

# Preserve plain-text vars already configured on the live Worker
# (FRONTEND_URL, FC_WORKER_URL, OCOS_T1/T2/T3/BUNDLE_PRODUCT_ID) so a deploy
# from this file does not wipe them. Secrets always persist across deploys.
keep_vars = true

# Static site bundle (nac-os-app.html, pricing.html, pwa/, upgrade/, …).
# run_worker_first keeps the Worker's routes (/, /dashboard, /nac-os/…) in
# charge; anything the router doesn't match falls through to env.ASSETS.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Worker custom domains. BOTH must stay declared here — a domain missing from
# this list can be dropped on deploy (this is how app.naturalalternatives.ca
# briefly disappeared on 2026-07-18, and how the apex was lost originally).
[[routes]]
pattern = "naturalalternatives.ca"
custom_domain = true

[[routes]]
pattern = "app.naturalalternatives.ca"
custom_domain = true

# Daily nurture cron — 8:00 AM ET (13:00 UTC)
[triggers]
crons = ["0 13 * * *"]

# ── D1 DATABASES ─────────────────────────────────────────────────────────────
# BOTH bindings are required. `wrangler deploy` replaces the Worker's bindings
# with exactly what is declared here — omitting CMD_DB breaks the Command
# Centre APIs (Site Summary, Draw Tracker, Field Command, Audit Log).
[[d1_databases]]
binding = "DB"
database_name = "nac-os-licenses"
database_id = "cb6f16b4-066e-4496-9d5c-a2a921576967"

[[d1_databases]]
binding = "CMD_DB"
database_name = "nac-command-centre"
database_id = "f171258e-eda8-4e58-a951-3967d791880b"

# ── KV — demo access codes ───────────────────────────────────────────────────
# Account namespace "lumo-demo-codes" (the only demo-codes KV on the account)
[[kv_namespaces]]
binding = "DEMO_CODES"
id = "e324b5653a4a460b866599ab1afd1e9a"

# ── SECRETS (persist across deploys; set once via `wrangler secret put`) ─────
# ADMIN_PASSWORD, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# RESEND_API_KEY, FC_INTERNAL_SECRET
